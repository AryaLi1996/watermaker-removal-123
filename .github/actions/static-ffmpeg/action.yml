name: Install a static ffmpeg
description: >
  Put a self-contained ffmpeg/ffprobe pair on PATH on a Windows runner, for a
  job that copies what PATH resolves to into something it ships.

# Shared by the release workflow, which bundles these binaries, and by the CI
# job that checks the bundling still works. One definition on purpose: a copy
# in CI would test itself rather than the release, and would drift the first
# time only one of them was corrected.

runs:
  using: composite
  steps:
    - name: Fetch a static ffmpeg and put it on PATH
      shell: bash
      run: |
        # A *static* ffmpeg, deliberately not chocolatey's.
        #
        # Chocolatey puts a shim on PATH — a launcher that finds the real
        # binary relative to chocolatey's own directory — and the packaging
        # step copies whatever PATH points at. A copied shim resolves nothing
        # and exits 4294967295, which is how a release once shipped unable to
        # read a single video.
        #
        # An earlier attempt searched chocolatey's own directory for the real
        # binary. It found it — the layout was right — but wrote the MSYS path
        # `find` had answered with straight into $GITHUB_PATH, which Windows
        # cannot read, so PATH never gained the directory and the step silently
        # changed nothing. This stops depending on chocolatey's layout at all,
        # converts the path, and says which binary it took.
        # One attempt is not enough: this is a third-party host, and a single
        # 503 from it failed a run on main for a reason that had nothing to do
        # with the code under test. Retrying costs nothing when the download
        # succeeds first time, which is almost always.
        #
        # --retry alone covers the transient HTTP statuses and timeouts;
        # --retry-connrefused adds the case where the host is refusing
        # connections outright, which curl does not otherwise count as
        # transient. --retry-max-time bounds the whole thing so a host that is
        # properly down fails the step in a couple of minutes rather than
        # holding a runner.
        curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused \
          --retry-max-time 120 -o /tmp/ffmpeg.zip \
          https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        command -v 7z >/dev/null || { echo '7z is not on this runner'; exit 1; }
        7z x -y -o/tmp/ffmpeg-static /tmp/ffmpeg.zip >/dev/null
        # -print -quit rather than a pipe: `find | head` dies of SIGPIPE under
        # pipefail, which would fail the step for succeeding.
        exe=$(find /tmp/ffmpeg-static -name 'ffmpeg.exe' -print -quit)
        bin=$(dirname "$exe")
        if [ -z "$exe" ] || [ ! -f "$bin/ffprobe.exe" ]; then
          echo "no static ffmpeg/ffprobe pair in the archive"
          exit 1
        fi
        # $GITHUB_PATH is read by Windows, not by bash: `find` under Git Bash
        # answers in MSYS form (/c/...), and a PATH entry in that form means
        # nothing to Windows. Writing it unconverted is what made the previous
        # attempt a silent no-op — the search had found the binary, but the
        # directory never reached PATH.
        echo "selected $(cygpath -w "$bin")"
        cygpath -w "$bin" >> "$GITHUB_PATH"
