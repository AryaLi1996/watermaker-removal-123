name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The backend shells out to ffmpeg/ffprobe. Without them the media tests
      # skip rather than fail, so install them to get the real signal.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y ;;
          esac
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install npm dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      - name: Create the Python environment
        shell: bash
        run: |
          python -m venv backend/.venv
          if [ -f backend/.venv/bin/python ]; then PY=backend/.venv/bin/python; else PY=backend/.venv/Scripts/python.exe; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r backend/requirements.txt

      - name: Backend tests with coverage
        shell: bash
        working-directory: backend
        run: |
          if [ -f .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pytest ../tests/unit/backend --cov --cov-report=term-missing

      - name: Renderer tests
        run: npm run test:frontend

      - name: Lint
        run: npm run lint --prefix renderer

      - name: Build renderer
        run: npm run build:renderer

      # Electron needs a display on Linux; the other runners have one.
      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
