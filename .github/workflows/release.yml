name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon and macos-15-intel is Intel. Both are
        # needed: the backend is frozen by PyInstaller and ffmpeg is copied
        # from the runner, so each macOS artifact carries binaries for the
        # architecture that built it and cannot be cross-built from the other.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The backend shells out to ffmpeg/ffprobe. Without them the media tests
      # skip rather than fail, so install them to get the real signal.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y ;;
          esac
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install npm dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      - name: Create the Python environment
        shell: bash
        run: |
          python -m venv backend/.venv
          if [ -f backend/.venv/bin/python ]; then PY=backend/.venv/bin/python; else PY=backend/.venv/Scripts/python.exe; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r backend/requirements.txt

      # scripts/build.js freezes the backend and builds the renderer; the
      # frozen binary is what the installed app actually runs.
      # AppImage packaging needs FUSE on the runner; the others need nothing.
      - name: Platform build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfuse2

      # Code signing — set these secrets to produce signed builds.
      #
      # They cannot be passed to the build step directly. An unset secret
      # expands to an empty string, and electron-builder treats CSC_LINK as a
      # certificate path whenever it is *defined*, empty or not: it resolved
      # "" against the checkout directory and failed the macOS job with
      # "<workspace> not a file". So export each variable only when there is
      # something in it, and tell electron-builder plainly when there is not.
      - name: Signing environment
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Heredoc form: a certificate is base64 and a password is arbitrary.
          export_env() {
            {
              echo "$1<<__WATERMARK_EOF__"
              echo "$2"
              echo "__WATERMARK_EOF__"
            } >> "$GITHUB_ENV"
          }

          if [ -n "$IN_CSC_LINK" ]; then
            export_env CSC_LINK "$IN_CSC_LINK"
            export_env CSC_KEY_PASSWORD "$IN_CSC_KEY_PASSWORD"
            echo "Signing with the certificate in CSC_LINK."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate configured — building unsigned."
          fi

          if [ -n "$IN_APPLE_ID" ] && [ -n "$IN_APPLE_TEAM_ID" ]; then
            export_env APPLE_ID "$IN_APPLE_ID"
            export_env APPLE_APP_SPECIFIC_PASSWORD "$IN_APPLE_APP_SPECIFIC_PASSWORD"
            export_env APPLE_TEAM_ID "$IN_APPLE_TEAM_ID"
            echo "Notarization credentials present."
          else
            echo "No notarization credentials — the macOS build will not be notarized."
          fi

      # scripts/build.js is local and deterministic, so it runs once. Packaging
      # is not: on a cold cache electron-builder fetches the ~117 MB Electron
      # runtime from GitHub release assets, and app-builder abandons the whole
      # download on the first network error rather than retrying. A single
      # "connection reset by peer" 30 ms in has already failed a release. So
      # retry the packaging step, and only when the failure looks like the
      # network — a real build error should still fail once, quickly.
      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build.js

          case "$RUNNER_OS" in
            macOS)   platform=--mac ;;
            Windows) platform=--win ;;
            *)       platform=--linux ;;
          esac

          log="$RUNNER_TEMP/electron-builder.log"

          package() {
            npx --no-install electron-builder "$platform" --publish never 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }

          # Transports, not exit codes: app-builder reports a failed download as
          # a generic ERR_ELECTRON_BUILDER_CANNOT_EXECUTE, so the underlying
          # message is the only thing that distinguishes it from a build error.
          transient='connection reset|connection refused|broken pipe|unexpected EOF|socket hang up|i/o timeout|TLS handshake|context deadline exceeded|no such host|server misbehaving|ECONNRESET|ETIMEDOUT|ENETUNREACH|EAI_AGAIN|Client.Timeout|HTTP (502|503|504)'

          for attempt in 1 2 3; do
            if package; then exit 0; fi

            if ! grep -Eqi "$transient" "$log"; then
              echo "Packaging failed for a reason retrying will not fix."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Packaging still hitting network errors after 3 attempts."
              exit 1
            fi

            echo "::warning::Packaging hit a network error (attempt $attempt of 3); retrying."
            sleep $((attempt * 15))
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v1.2.3-beta.1 and friends publish as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
